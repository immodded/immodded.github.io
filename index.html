<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>immodded</title>

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- GitHub Markdown Style -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css"/>

  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    header {
      padding: 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent);
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.8;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }

    /* Markdown Styling Fix */
    .markdown-body {
      background: transparent;
      color: var(--text);
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      color: var(--accent);
    }

    .markdown-body a {
      color: var(--accent);
    }

    .markdown-body code {
      background: #1f2933;
      padding: 0.2rem 0.4rem;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      padding: 1rem;
      opacity: 0.6;
    }

    /* Mobile */
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.4rem;
      }

      main {
        padding: 0.8rem;
      }

      .card {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>SAHIL</h1>
  <p>Developer • Designer • Researcher</p>
</header>

<main>
  <div class="card markdown-body" id="profile-readme">
    Loading CV...
  </div>
</main>

<footer>
  © 2026 • Powered by GitHub README
</footer>

<script>
async function loadReadme() {
  const url = "https://raw.githubusercontent.com/immodded/immodded/main/README.md";
  try {
    const res = await fetch(url);
    const markdown = await res.text();
    document.getElementById("profile-readme").innerHTML =
      marked.parse(markdown);
  } catch (err) {
    document.getElementById("profile-readme").innerHTML =
      "<p>Failed to load README.</p>";
  }
}

loadReadme();
</script>

</body>
</html>
